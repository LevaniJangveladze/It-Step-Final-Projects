@if(showTab()) {
  <div class="qr-tab" (click)="openModal()">
    <span class="qr-tab__label">🔍</span>
  </div>
}

@if(showModal()) {
  <div class="qr-overlay" (click)="closeModal()">
    <div class="qr-modal" (click)="$event.stopPropagation()">
      <div class="qr-modal__stars">✨ ✨ ✨</div>
      <h2 class="qr-modal__title">🎉 You found the hidden QR!</h2>
      <p class="qr-modal__subtitle">Congratulations, you're a true explorer!</p>
      <div class="qr-modal__image-wrapper">
        <img [src]="qrImage()" alt="Secret QR Code">
      </div>
      <p class="qr-modal__hint">Scan me! 📱</p>
      <button class="qr-modal__close" (click)="closeModal()">✕</button>
    </div>
  </div>
}
